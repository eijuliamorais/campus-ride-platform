<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniRide · Assistente de Caronas</title>
<style>
  :root { --azul: #1f4e8c; --azul-claro: #e8f0fb; --cinza: #6b7280; --borda: #dde3ec; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6fa;
         color: #1c2330; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 460px; background: #fff; display: flex; flex-direction: column;
         height: 100vh; box-shadow: 0 0 24px rgba(0,0,0,.06); }
  header { background: var(--azul); color: #fff; padding: 16px 18px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  .conta { margin-top: 12px; font-size: 13px; }
  .conta form { display: flex; gap: 6px; padding: 0; border: 0; }
  .conta input { flex: 1; border: 0; border-radius: 16px; padding: 7px 12px; font-size: 13px; outline: none; }
  .conta button { background: #fff; color: var(--azul); border: 0; border-radius: 16px; padding: 0 12px;
                  font-size: 13px; font-weight: 600; cursor: pointer; }
  .conta a { color: #fff; }
  #erro-entrar { display: block; margin-top: 4px; font-size: 12px; color: #ffd7d7; }
  .falha { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; opacity: .9; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; }
  .eu { align-self: flex-end; background: var(--azul); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--azul-claro); border-bottom-left-radius: 4px; }
  .bot.fallback { background: #fff4e5; border: 1px solid #f5c77e; }
  .fonte { display: inline-block; background: #fff; border: 1px solid var(--borda); color: var(--azul);
           border-radius: 6px; padding: 0 5px; font-size: 11.5px; }
  .meta { font-size: 11.5px; color: var(--cinza); margin-top: 6px; white-space: normal; }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .sugestoes button { border: 1px solid var(--borda); background: #fff; color: var(--azul); border-radius: 16px;
                      padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--borda); }
  input[type=text] { flex: 1; border: 1px solid var(--borda); border-radius: 20px; padding: 10px 14px; font-size: 14.5px; outline: none; }
  input[type=text]:focus { border-color: var(--azul); }
  form button { background: var(--azul); color: #fff; border: 0; border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Assistente de Caronas</h1>
    <p>UniRide · tire dúvidas sobre as regras ou procure caronas de hoje</p>
    <div class="conta">
      <form id="form-entrar">
        <input type="email" id="email" placeholder="Entre com seu e-mail @estudante.ufla.br" required>
        <button>Entrar</button>
      </form>
      <span id="erro-entrar"></span>
      <div id="logado" hidden>Olá, <b id="nome"></b>! Já posso consultar as suas reservas. · <a href="#" id="sair">Sair</a></div>
    </div>
    <label class="falha"><input type="checkbox" id="falha"> Simular falha do provedor do LLM (demo)</label>
  </header>
  <div id="msgs">
    <div class="msg bot">Oi! Posso explicar as regras do UniRide (cancelamento, avaliações, segurança, pontos de encontro, contribuição) e procurar caronas abertas para hoje.</div>
  </div>
  <div class="sugestoes" id="sugestoes">
    <button>Posso cancelar uma carona 1 hora antes?</button>
    <button>Tem carona do campus para o centro hoje à noite?</button>
    <button>Qual a nota mínima para continuar no app?</button>
    <button>Eu tenho alguma carona reservada?</button>
  </div>
  <form id="form">
    <input type="text" id="pergunta" placeholder="Escreva sua pergunta..." autocomplete="off" required>
    <button id="enviar">Enviar</button>
  </form>
</div>
<script>
  const msgs = document.getElementById("msgs"), campo = document.getElementById("pergunta"),
        botao = document.getElementById("enviar"), falha = document.getElementById("falha");
  let usuario = null;

  // Lembra quem entrou enquanto a aba estiver aberta (sessionStorage pode falhar em alguns navegadores).
  function guardar(u) { try { u ? sessionStorage.setItem("uniride-usuario", JSON.stringify(u)) : sessionStorage.removeItem("uniride-usuario"); } catch (e) {} }
  function lembrar() { try { return JSON.parse(sessionStorage.getItem("uniride-usuario")); } catch (e) { return null; } }

  function mostrarConta() {
    document.getElementById("form-entrar").hidden = !!usuario;
    document.getElementById("logado").hidden = !usuario;
    if (usuario) document.getElementById("nome").textContent = usuario.nome.split(" ")[0];
  }

  document.getElementById("form-entrar").addEventListener("submit", async ev => {
    ev.preventDefault();
    const erro = document.getElementById("erro-entrar");
    erro.textContent = "";
    try {
      const r = await fetch("/api/v1/assistente/entrar", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: document.getElementById("email").value})
      });
      if (!r.ok) { erro.textContent = r.status === 404 ? "E-mail não cadastrado no UniRide." : "Não foi possível entrar agora."; return; }
      usuario = await r.json();
      guardar(usuario);
      mostrarConta();
    } catch (e) { erro.textContent = "Não foi possível entrar agora."; }
  });

  document.getElementById("sair").addEventListener("click", ev => {
    ev.preventDefault();
    usuario = null;
    guardar(null);
    mostrarConta();
  });

  // nomes amigáveis: o estudante não precisa ver nome de arquivo nem de ferramenta
  const FONTES = {"regras_cancelamento.md": "Regras de cancelamento", "avaliacoes_e_penalidades.md": "Avaliações e penalidades",
    "contribuicao_e_custos.md": "Contribuição e custos", "pontos_de_encontro.md": "Pontos de encontro",
    "seguranca.md": "Segurança", "faq.md": "Perguntas frequentes"};
  const CONSULTAS = {"buscar_caronas": "as caronas abertas", "minhas_solicitacoes": "as suas reservas"};
  function nomeFonte(f) { return FONTES[f] || f.replace(/\.md$/, "").replace(/_/g, " "); }

  function escapar(t) { return t.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

  function adicionar(classe, html) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    div.innerHTML = html;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  async function perguntar(texto) {
    adicionar("eu", escapar(texto));
    const espera = adicionar("bot", "Pensando...");
    botao.disabled = true;
    try {
      const r = await fetch("/api/v1/assistente/perguntar", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pergunta: texto, usuarioId: usuario ? usuario.usuarioId : null})
      });
      const d = await r.json();
      const resposta = escapar(d.resposta).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        .replace(/\[([\w.-]+\.md)\]/g, (_, f) => '<span class="fonte">' + nomeFonte(f) + "</span>");
      const partes = [d.modo === "fallback" ? "modo de contingência (fallback)" : "resposta da IA", d.latencia_ms + " ms"];
      if (d.tools_usadas.length) partes.push("consultou " + d.tools_usadas.map(t => CONSULTAS[t] || "o sistema").join(" e "));
      if (d.fontes.length) partes.push("fontes: " + d.fontes.map(nomeFonte).join(", "));
      espera.className = "msg bot" + (d.modo === "fallback" ? " fallback" : "");
      espera.innerHTML = resposta + '<div class="meta">' + escapar(partes.join(" · ")) + "</div>";
    } catch (e) {
      espera.textContent = "Não consegui falar com o assistente agora. Tente de novo em instantes.";
    }
    botao.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
  }

  document.getElementById("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const texto = campo.value.trim();
    if (texto) { campo.value = ""; perguntar(texto); }
  });
  document.querySelectorAll("#sugestoes button").forEach(b => b.addEventListener("click", () => perguntar(b.textContent)));
  falha.addEventListener("change", () => fetch("/admin/simular-falha?ativo=" + falha.checked, {method: "POST"}));
  usuario = lembrar();
  mostrarConta();
  fetch("/health").then(r => r.json()).then(d => { falha.checked = d.simular_falha; }).catch(() => {});
</script>
</body>
</html>
