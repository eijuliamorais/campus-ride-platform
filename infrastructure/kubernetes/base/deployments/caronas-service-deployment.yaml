
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caronas-service
  namespace: uniride
  labels:
    app: caronas-service
    app.kubernetes.io/part-of: uniride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caronas-service
  template:
    metadata:
      labels:
        app: caronas-service
        app.kubernetes.io/part-of: uniride
    spec:
      containers:
        - name: caronas-service
          image: uniride/caronas-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: caronas-service
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
