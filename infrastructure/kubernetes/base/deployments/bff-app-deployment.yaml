apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-app
  namespace: uniride
  labels:
    app: bff-app
    app.kubernetes.io/part-of: uniride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-app
  template:
    metadata:
      labels:
        app: bff-app
        app.kubernetes.io/part-of: uniride
    spec:
      containers:
        - name: bff-app
          image: uniride/bff-app:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uniride-application-config
          env:
            - name: SERVICE_NAME
              value: bff-app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false