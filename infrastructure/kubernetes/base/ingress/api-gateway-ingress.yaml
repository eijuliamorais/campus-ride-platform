apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uniride-api-gateway
  namespace: uniride
spec:
  ingressClassName: traefik
  rules:
    - host: uniride.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
